name: Deploy to trading PC

# Deploys every merge to main, after CI passes. Can also be run by hand from the Actions tab
# ("Run workflow", then pick the branch): the tests and the deploy use that same commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it midway.
concurrency:
  group: deploy-trading-pc
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Your Ubuntu PC, registered as a self-hosted runner with the label "darwin-pc".
    # Never runs for pull requests or forks; only pushes to main or a manual run by you.
    runs-on: [self-hosted, linux, darwin-pc]
    # Optional: add required reviewers to the "trading-pc" environment in repo settings
    # to approve each deploy by hand.
    environment: trading-pc
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4  # same commit CI just tested
      - name: Deploy
        run: scripts/deploy.sh "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"
