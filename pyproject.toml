[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flick"
version = "0.1.0"
description = "Options scanner, analyser, paper trader and position manager (Alpaca)"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.40",
  "pyyaml>=6",
  "python-dotenv>=1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
flick = "flick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
