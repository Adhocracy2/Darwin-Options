[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-options"
version = "0.1.0"
description = "Options scanner, analyser, paper trader and position manager (Interactive Brokers)"
requires-python = ">=3.10"
dependencies = [
  "ib_async>=2.0",
  "pyyaml>=6",
  "python-dotenv>=1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=2.0,<3",  # the dashboard's Supervisor chat (Claude API)
  "py7zr>=0.20",  # reading historical data archives (darwin import-history)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
darwin = "darwin_options.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
