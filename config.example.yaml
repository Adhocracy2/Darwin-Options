# Copy to config.yaml and edit. Every key is optional; defaults are in src/darwin_options/config.py.

# Broker: Interactive Brokers, through IB Gateway or TWS.
# mode: sim   = local simulated fills on real IBKR quotes
#       paper = your IBKR paper account (recommended to start)
#       live  = real money; also needs DARWIN_ALLOW_LIVE in .env, and the gateway logged into your live account
mode: paper
data: ibkr                # ibkr | synthetic (offline testing, sim mode only)

network:
  # The 3D office shows whether the internet and the router are up: it pings internet_host, and if
  # that fails, the router. "auto" uses this machine's default gateway (e.g. 192.168.1.1).
  enabled: true
  internet_host: google.com
  router_host: auto
  interval_s: 30

record:
  # Save every price received from IBKR (stock prices, option bid/ask/IV/greeks) to a separate
  # database for `darwin replay` and history. Tens of MB per trading day. `darwin data` shows totals.
  enabled: true
  path: var/marketdata.db

ibkr:
  host: 127.0.0.1
  port: 4002              # IB Gateway: 4002 paper, 4001 live. TWS: 7497 paper, 7496 live
  client_id: 17           # the dashboard uses client_id + 1
  account: ""             # blank = the only account on the login
  market_data_type: 1     # 1 = live (needs OPRA options data subscription), 3 = delayed
  max_expiries: 2
  usd_per_base: 0         # non-USD account (e.g. AUD): US$ per 1 unit of it, e.g. 0.65. Fallback only.

universe: [SPY, QQQ, IWM]
allow_new_entries: true
max_new_trades_per_cycle: 2
vol_blend: 0.5            # forecast vol = 0.5*IV + 0.5*30-day realized vol

credit_spread:
  enabled: true
  sides: [put, call]
  dte_min: 30
  dte_max: 50
  short_delta_min: 0.15
  short_delta_max: 0.30
  widths: [1, 2, 5]
  min_credit_pct_of_width: 0.20
  min_otm_pct: 0.02

iron_condor:
  enabled: true
  dte_min: 30
  dte_max: 50
  short_delta_min: 0.10
  short_delta_max: 0.20
  widths: [2, 5]                 # same width on both sides
  min_credit_pct_of_width: 0.25

iron_butterfly:
  enabled: true
  dte_min: 30
  dte_max: 50
  wing_widths: [5, 10]
  min_credit_pct_of_width: 0.50

calendar:
  enabled: true
  rights: [put, call]
  front_dte_min: 25
  front_dte_max: 40
  back_gap_min: 21               # back month expires 21-63 days after the front
  back_gap_max: 63
  strikes_from_atm: 1

leaps_call:
  # A deep-ITM SPY LEAPS costs ~$5-10k. With the default $500 trade cap only
  # cheaper underlyings will qualify; raise risk.max_loss_per_trade if you want these.
  enabled: true
  leaps_dte_min: 270
  leaps_delta_min: 0.75
  short_dte_min: 21
  short_dte_max: 45
  short_delta_min: 0.15
  short_delta_max: 0.30

same_day:
  # Rules for any strategy whose days to expiry are 0 to 0 (options expiring today, 0DTE).
  # Add one from the dashboard: Strategies > Add strategy > tick "Options expiring today".
  # Untested with real money. Needs live option quotes (ibkr.market_data_type: 1).
  entry_start: "10:00"           # New York time
  entry_end: "13:30"
  close_by_time: "15:30"         # default; each strategy can change its own
  require_live_data: true
  # Risk budget for all same-day trades together (enforced by the Risk Desk)
  max_risk_per_trade_pct: 0.01   # of equity (below the normal per-trade cap)
  max_trades_per_day: 3
  max_open: 2
  daily_loss_limit_pct: 0.02     # no new same-day trades today once same-day losses reach this
  skip_dates: []                 # e.g. ["2026-11-04"]: Fed, CPI, jobs-report days
  # Profit and loss rules (on top of the strategy's stop, strike guard and close-by time)
  profit_targets: [["09:30", 0.50], ["13:00", 0.35], ["14:30", 0.25]]  # take profit, falling through the day
  lock_profit_at: 0.40           # once up 40% of the credit...
  lock_profit_floor: 0.15        # ...close if profit falls back to 15%
  losing_time_stop: "14:30"      # close any same-day trade still losing at this time

# More strategies beyond the five above (usually added from the dashboard instead), e.g.:
# custom_strategies:
#   - {id: condor_0dte, type: iron_condor, label: "Condor 0DTE", enabled: false,
#      entry: {dte_min: 0, dte_max: 0, short_delta_min: 0.05, short_delta_max: 0.15, widths: [2, 3, 5],
#              min_credit_pct_of_width: 0.05, min_otm_pct: 0.004}}

filters:
  min_open_interest: 100
  max_leg_spread_pct: 0.15
  min_bid: 0.05

risk:
  max_loss_per_trade: 2500       # dollars; hard cap on any one trade
  max_positions_per_underlying: 2  # spread positions across tickers
  min_score: 0.0
  no_entries_after_open_min: 30  # no new trades until 10:00 New York; exits still run
  # Usual rules for a ~$10k account: risk 1-5% per trade, 5-10 smaller positions,
  # about 30% of the account at risk in total. Add more stages to change limits by size.
  stages:
    - {min_equity: 0, risk_per_trade_pct: 0.05, max_portfolio_risk_pct: 0.30, max_positions: 10}
  min_risk_per_trade_pct: 0.01   # skip trades risking under 1%: too small after commissions
  # Size from your own results once there are enough: half the Kelly bet, capped at 5%.
  kelly_multiplier: 0.5
  min_trades_for_kelly: 30
  probation_risk_pct: 0.02       # per-trade ceiling before then
  pause_if_no_edge: true         # stop new trades if your results show no edge
  drawdown_reduce_at: 0.15       # halve trade size 15% below the equity peak
  drawdown_halt_at: 0.30         # stop new trades 30% below the peak (reset on the dashboard)
  daily_loss_halt_pct: 0.06      # no new trades for the rest of a day that's down 6%
  groups:                        # underlyings that move together share one risk budget
    US equity index: [SPY, QQQ, IWM, DIA]
  max_group_risk_pct: 0.30
  # Use only part of the account. Sizing, drawdown and goals are measured on this plus the
  # system's own P&L. Leave unset to use the whole account.
  capital: 10000
  # Pilot mode: hard dollar limits replace the % limits (one trade at a time).
  pilot: false
  pilot_max_loss_per_trade: 500
  pilot_max_positions: 1
  pilot_max_new_trades_per_day: 1
  pilot_strategies: [credit_spread]   # strategy ids or types
  pilot_max_leg_spread_pct: 0.10

rolling:                         # roll credit spreads instead of closing, only when it pays
  enabled: true
  strategies: [credit_spread]    # strategy types; same-day trades are never rolled
  on_reasons: ["dte exit"]       # only at the planned time exit; never threatened or stop-loss trades
  min_net_credit: 0.05           # per share
  max_rolls: 1

management:
  take_profit_pct: 0.50
  stop_loss_mult: 2.0
  close_at_dte: 21
  min_short_extrinsic: 0.10
  itm_buffer_pct: 0.005
  leaps_close_at_dte: 120
  leaps_stop_loss_pct: 0.40
  debit_stop_loss_pct: 0.50      # debit trades (calendars)
  # Per-strategy changes to any management setting; merged into the defaults.
  overrides:
    iron_butterfly: {take_profit_pct: 0.25, check_threatened: false}
    calendar: {take_profit_pct: 0.25, close_at_dte: 5, check_threatened: false}

execution:
  slippage_frac: 0.25
  commission_per_contract: 0.65
  fill_timeout_s: 45
