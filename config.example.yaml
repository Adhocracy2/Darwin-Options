# Copy to config.yaml and edit. Every key is optional; defaults are in src/flick/config.py.

# Broker: Interactive Brokers, through IB Gateway or TWS.
# mode: sim   = local simulated fills on real IBKR quotes
#       paper = your IBKR paper account (recommended to start)
#       live  = real money; also needs FLICK_ALLOW_LIVE in .env, and the gateway logged into your live account
mode: paper
data: ibkr                # ibkr | synthetic (offline testing, sim mode only)

ibkr:
  host: 127.0.0.1
  port: 4002              # IB Gateway: 4002 paper, 4001 live. TWS: 7497 paper, 7496 live
  client_id: 17           # the dashboard uses client_id + 1
  account: ""             # blank = the only account on the login
  market_data_type: 1     # 1 = live (needs OPRA options data subscription), 3 = delayed
  max_expiries: 2

universe: [SPY, QQQ, IWM]
allow_new_entries: true
max_new_trades_per_cycle: 2
vol_blend: 0.5            # forecast vol = 0.5*IV + 0.5*30-day realized vol

credit_spread:
  enabled: true
  sides: [put, call]
  dte_min: 30
  dte_max: 50
  short_delta_min: 0.15
  short_delta_max: 0.30
  widths: [1, 2, 5]
  min_credit_pct_of_width: 0.20
  min_otm_pct: 0.02

iron_condor:
  enabled: true
  dte_min: 30
  dte_max: 50
  short_delta_min: 0.10
  short_delta_max: 0.20
  widths: [2, 5]                 # same width on both sides
  min_credit_pct_of_width: 0.25

iron_butterfly:
  enabled: true
  dte_min: 30
  dte_max: 50
  wing_widths: [5, 10]
  min_credit_pct_of_width: 0.50

calendar:
  enabled: true
  rights: [put, call]
  front_dte_min: 25
  front_dte_max: 40
  back_gap_min: 21               # back month expires 21-63 days after the front
  back_gap_max: 63
  strikes_from_atm: 1

leaps_call:
  # A deep-ITM SPY LEAPS costs ~$5-10k. With the default $500 trade cap only
  # cheaper underlyings will qualify; raise risk.max_loss_per_trade if you want these.
  enabled: true
  leaps_dte_min: 270
  leaps_delta_min: 0.75
  short_dte_min: 21
  short_dte_max: 45
  short_delta_min: 0.15
  short_delta_max: 0.30

filters:
  min_open_interest: 100
  max_leg_spread_pct: 0.15
  min_bid: 0.05

risk:
  max_loss_per_trade: 2500       # dollars; hard cap on any one trade
  max_positions_per_underlying: 2
  min_score: 0.0
  # Growth stages by account size (ceilings). Small accounts can't diversify: the smallest
  # spread is a big share of them, so limits start higher and tighten as equity grows.
  stages:
    - {min_equity: 0,     risk_per_trade_pct: 0.20, max_portfolio_risk_pct: 0.40, max_positions: 2}
    - {min_equity: 2000,  risk_per_trade_pct: 0.10, max_portfolio_risk_pct: 0.35, max_positions: 4}
    - {min_equity: 10000, risk_per_trade_pct: 0.05, max_portfolio_risk_pct: 0.30, max_positions: 8}
    - {min_equity: 50000, risk_per_trade_pct: 0.02, max_portfolio_risk_pct: 0.25, max_positions: 12}
  # Size from your own results once there are enough: half the Kelly bet, capped by the stage.
  kelly_multiplier: 0.5
  min_trades_for_kelly: 30
  probation_risk_pct: 0.05       # per-trade ceiling before then
  pause_if_no_edge: true         # stop new trades if your results show no edge
  drawdown_reduce_at: 0.15       # halve trade size 15% below the equity peak
  drawdown_halt_at: 0.30         # stop new trades 30% below the peak (reset on the dashboard)
  daily_loss_halt_pct: 0.06      # no new trades for the rest of a day that's down 6%
  groups:                        # underlyings that move together share one risk budget
    US equity index: [SPY, QQQ, IWM, DIA]
  max_group_risk_pct: 0.30
  # Use only part of the account. Sizing, drawdown and goals are measured on this plus the
  # system's own P&L. Leave unset to use the whole account.
  capital: 500
  # Pilot mode for the first live days: hard dollar limits replace the % limits.
  pilot: true
  pilot_max_loss_per_trade: 500   # one $5-wide spread; $1-wide spreads lose to commissions
  pilot_max_positions: 1
  pilot_max_new_trades_per_day: 1
  pilot_strategies: [credit_spread]
  pilot_max_leg_spread_pct: 0.10

rolling:                         # roll credit spreads instead of closing, only when it pays
  enabled: true
  strategies: [credit_spread]
  on_reasons: ["dte exit", "short strike threatened"]   # never on stop losses
  min_net_credit: 0.05           # per share
  max_rolls: 2

management:
  take_profit_pct: 0.50
  stop_loss_mult: 2.0
  close_at_dte: 21
  min_short_extrinsic: 0.10
  itm_buffer_pct: 0.005
  leaps_close_at_dte: 120
  leaps_stop_loss_pct: 0.40
  debit_stop_loss_pct: 0.50      # debit trades (calendars)
  # Per-strategy changes to any management setting; merged into the defaults.
  overrides:
    iron_butterfly: {take_profit_pct: 0.25, check_threatened: false}
    calendar: {take_profit_pct: 0.25, close_at_dte: 5, check_threatened: false}

execution:
  slippage_frac: 0.25
  commission_per_contract: 0.65
  fill_timeout_s: 45
